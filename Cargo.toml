[package]
name = "timerd-rs"
version = "0.5.0"
edition = "2024"
description = "A small foreground/background terminal timer for Linux"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/reidliu41/timer-rs"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "timer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29"
nix = { version = "0.30", features = ["process", "term", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true

